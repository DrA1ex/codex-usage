[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-usage-local"
version = "1.0.0"
description = "Local Codex usage and observed quota capacity reports"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
zstd = ["zstandard>=0.22"]

[project.scripts]
codex-usage = "codex_usage.cli:main"
codex-usage-web = "codex_usage.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_usage = ["report.html", "web/*", "web/js/*", "web/img/*"]
